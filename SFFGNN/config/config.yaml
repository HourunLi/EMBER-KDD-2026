bailA:
  train_epochs: 800
  lr: 0.006
  lr2_reg: 0.001
  dropout: 0.6
  runs: 5
  hidden_dim: 64
  n_layers: 1
  use_checkpoint: true
  inter_encoder: GCN
  lambda_fair: 4.0
  meta_lr: 0.02
  source_mmd_bandwidth: 1.5
  source_mmd_min_samples: 8
  source_mmd_max_samples: 0
  # target adaptation
  adapt_epochs: 75
  adapt_lr: 0.0008
  adapter_bottleneck: 8
  tau_c: 0.25
  proto_temp: 1.0
  lambda_pi: 0.005
  tau_adjust: 1.0
  alpha_p: 0.8
  lambda_s: 1.0
  lambda_e: 0.0
  lambda_anchor: 5.0
  target_lambda_fair: 0.5
  target_mmd_bandwidth: 1.5
  mmd_chunk_size: 256
  target_mmd_min_samples: 8
  target_mmd_max_samples: 512
  fairness_warmup_ratio: 0.2
