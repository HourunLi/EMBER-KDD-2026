# CELL-style t-SNE visualization config for SFFGNN.
#
# Default workflow:
#   python SFFGNN/visualization/run_tsne.py --datasets pokec --methods SFFGNN,DGSDA
#
# Baseline folders can be copied under baseline/<MethodName>/.
# To be auto-readable by this config, each method should export:
#   baseline/<MethodName>/visualization_embeddings/<dataset>_<stage>_feat.npz
#   baseline/<MethodName>/visualization_embeddings/<dataset>_<stage>_labels.npz
# where feat.npz has key "representations" and labels.npz has key "labels".

project:
  root: "{config_dir}/../.."

stage: source_trained
output_dir: "{sffgnn_root}/results/visualization"

defaults:
  embedding_paths:
    - "{method_root}/visualization_embeddings/{dataset}_{stage}_feat.npz"
    - "{method_root}/visualization_embeddings/{dataset}_feat.npz"
    - "{method_root}/{dataset}_{stage}_feat.npz"
    - "{method_root}/{dataset}_feat.npz"
  label_paths:
    - "{method_root}/visualization_embeddings/{dataset}_{stage}_labels.npz"
    - "{method_root}/visualization_embeddings/{dataset}_labels.npz"
    - "{method_root}/{dataset}_{stage}_labels.npz"
    - "{method_root}/{dataset}_labels.npz"

datasets:
  - name: pokec
    title: Pokec-n
    enabled: true
  - name: bail
    title: Bail
    enabled: false
  - name: credit
    title: Credit
    enabled: false
  - name: german
    title: German
    enabled: false
  - name: syn
    title: Synthetic
    enabled: false
  - name: nba
    title: NBA
    enabled: false

methods:
  - name: SFFGNN
    enabled: true
    root: "{sffgnn_root}"
    embedding_paths:
      - "{method_root}/visualization_embeddings/{dataset}_{stage}_feat.npz"
      - "{method_root}/visualization_embeddings/{dataset}_feat.npz"
      - "{method_root}/{dataset}_{stage}_feat.npz"
      - "{method_root}/{dataset}_feat.npz"
      - "{project_root}/{dataset}_{stage}_feat.npz"
      - "{project_root}/{dataset}_feat.npz"
    label_paths:
      - "{method_root}/visualization_embeddings/{dataset}_{stage}_labels.npz"
      - "{method_root}/visualization_embeddings/{dataset}_labels.npz"
      - "{method_root}/{dataset}_{stage}_labels.npz"
      - "{method_root}/{dataset}_labels.npz"
      - "{project_root}/{dataset}_{stage}_labels.npz"
      - "{project_root}/{dataset}_labels.npz"

  - name: DGSDA
    enabled: false
    root: "{baseline_root}/DGSDA"
  - name: GRADE
    enabled: false
    root: "{baseline_root}/GRADE"
  - name: GraphAny
    enabled: false
    root: "{baseline_root}/GraphAny"
  - name: HGDA
    enabled: false
    root: "{baseline_root}/HGDA"
  - name: UDAGCN
    enabled: false
    root: "{baseline_root}/UDAGCN"

labels:
  # Same group coding as SFFGNN's existing npz export:
  # 0: sensitive group 0 with positive task label
  # 1: sensitive group 1 with positive task label
  # 2: sensitive group 0 with negative task label
  # 3: sensitive group 1 with negative task label
  groups:
    0: "Y=1, S=0"
    1: "Y=1, S=1"
    2: "Y=0, S=0"
    3: "Y=0, S=1"

sampling:
  max_points: 5000
  stratify: true
  random_state: 42

tsne:
  random_state: 42
  perplexity: 30
  init: pca
  learning_rate: auto
  max_iter: 1000
  metric: euclidean
  normalize: minmax

plot:
  formats: [png, pdf]
  dpi: 300
  max_cols: 3
  width_per_panel: 4.0
  height_per_row: 3.7
  point_size: 8
  alpha: 0.72
  group_order: [0, 1, 2, 3]
  colors: ["#1f77b4", "#ff7f0e", "#2ca02c", "#d62728"]
  markers: ["o", "s", "^", "D"]

