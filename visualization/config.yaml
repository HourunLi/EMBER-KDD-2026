# Publication-style t-SNE visualization config.
#
# Input convention:
#   visualization/embeddings/<method>/<dataset>/feat.npz
#   visualization/embeddings/<method>/<dataset>/labels.npz
#
# Output convention:
#   visualization/results/<method>_<dataset>/coordinates.csv
#   visualization/results/<method>_<dataset>/tsne.png
#   visualization/results/<method>_<dataset>/tsne.pdf

project:
  root: "{config_dir}/.."

output_dir: "{visualization_root}/results"

defaults:
  embedding_paths:
    - "{embeddings_root}/{method}/{dataset}/feat.npz"
  label_paths:
    - "{embeddings_root}/{method}/{dataset}/labels.npz"

datasets:
  - name: bailA
    title: BailA
    enabled: false
  - name: germanA
    title: GermanA
    enabled: false
  - name: pokec
    title: Pokec
    enabled: true
  - name: syn
    title: Syn
    enabled: false

methods:
  - name: EMBER
    enabled: true
  - name: GCN
    enabled: true
  - name: NIFTY
    enabled: true
  - name: FairSIN
    enabled: true
  - name: SFG
    enabled: true
  - name: GraphAny
    enabled: true
  - name: DGSDA
    enabled: true
  - name: UDAGCN
    enabled: true
  - name: GRADE
    enabled: true
  - name: FatraGNN
    enabled: true
  - name: DANCE
    enabled: true

labels:
  groups:
    0: "Y=1, S=0"
    1: "Y=1, S=1"
    2: "Y=0, S=0"
    3: "Y=0, S=1"

sampling:
  max_points: 3000
  stratify: true
  random_state: 42

tsne:
  random_state: 0
  perplexity: 30
  init: pca
  learning_rate: auto
  max_iter: 1000
  metric: euclidean
  normalize: minmax

plot:
  formats: [png, pdf]
  dpi: 300
  figure_width: 5.2
  figure_height: 4.8
  point_size: 11
  marker_line_width: 0.0
  marker_edge_color: "none"
  alpha: 0.70
  axis_margin: 0.04
  tick_label_size: 18
  tick_length: 3.5
  tick_width: 0.8
  tick_pad: 3.5
  axis_label_size: 20
  axis_label_pad: 3.4
  spine_color: "#4D4D4D"
  spine_width: 0.8
  axes_facecolor: "#FFFFFF"
  equal_aspect: true
  show_ticks: false
  show_spines: false
  tight_layout: false
  savefig_pad_inches: 0.1
  show_legend: true
  legend_size: 9.5
  legend_ncol: 4
  legend_marker_scale: 1.25
  font_family: "serif"
  font_serif: ["Times New Roman", "Times", "DejaVu Serif"]
  title_template: "{method} t-SNE result on {dataset_title}"
  title_size: 16
  title_pad: 8
  xlabel_template: ""
  group_order: [0, 1, 2, 3]
  # Blue-red pairing sampled from the supplied scientific-colour reference.
  colors: ["#2A6F97", "#E58D5B", "#8EC5E8", "#F6C8A8"]
  markers: ["o", "o", "o", "o"]
