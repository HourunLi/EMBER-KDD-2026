# CELL-style t-SNE visualization config.
#
# Input convention:
#   visualization/embeddings/<method>/<dataset>/feat.npz
#   visualization/embeddings/<method>/<dataset>/labels.npz
#
# Output convention:
#   visualization/results/<method>_<dataset>/coordinates.csv
#   visualization/results/<method>_<dataset>/tsne.png
#   visualization/results/<method>_<dataset>/tsne.pdf

project:
  root: "{config_dir}/.."

output_dir: "{visualization_root}/results"

defaults:
  embedding_paths:
    - "{embeddings_root}/{method}/{dataset}/feat.npz"
  label_paths:
    - "{embeddings_root}/{method}/{dataset}/labels.npz"

datasets:
  - name: bailA
    title: BailA
    enabled: true
  - name: germanA
    title: GermanA
    enabled: true
  - name: pokec
    title: Pokec
    enabled: true
  - name: syn
    title: Syn
    enabled: true

methods:
  - name: EMBER
    enabled: true
  - name: DGSDA
    enabled: false
  - name: GRADE
    enabled: false
  - name: GraphAny
    enabled: false
  - name: HGDA
    enabled: false
  - name: UDAGCN
    enabled: false

labels:
  groups:
    0: "Y=1, S=0"
    1: "Y=1, S=1"
    2: "Y=0, S=0"
    3: "Y=0, S=1"

sampling:
  max_points: 5000
  stratify: true
  random_state: 42

tsne:
  random_state: 0
  perplexity: 30
  init: pca
  learning_rate: auto
  max_iter: 1000
  metric: euclidean
  normalize: minmax

plot:
  formats: [png, pdf]
  dpi: 300
  figure_width: 6.4
  figure_height: 4.8
  point_size: 20
  marker_line_width: 0.3
  alpha: 1.0
  axis_margin: 0.05
  tick_label_size: 18
  tick_length: 3.5
  tick_width: 0.8
  tick_pad: 3.5
  axis_label_size: 20
  axis_label_pad: 3.4
  spine_color: "#808080"
  spine_width: 1.0
  tight_layout: false
  savefig_pad_inches: 0.1
  show_legend: false
  font_family: "Times New Roman"
  font_serif: ["Times New Roman", "DejaVu Serif"]
  xlabel_template: "{method} {dataset_title} t-SNE result"
  group_order: [0, 1, 2, 3]
  colors: ["#FF7F50", "#6495ED", "#8FBC8F", "#FFC0CB"]
