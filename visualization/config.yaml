# Publication-style t-SNE visualization config.
#
# Input convention:
#   visualization/embeddings/<method>/<dataset>/feat.npz
#   visualization/embeddings/<method>/<dataset>/labels.npz
#
# Output convention:
#   visualization/results/<method>_<dataset>/coordinates.csv
#   visualization/results/<method>_<dataset>/<method>.png
#   visualization/results/<method>_<dataset>/<method>.pdf

project:
  root: "{config_dir}/.."

output_dir: "{visualization_root}/results"

defaults:
  embedding_paths:
    - "{embeddings_root}/{method}/{dataset}/feat.npz"
  label_paths:
    - "{embeddings_root}/{method}/{dataset}/labels.npz"

datasets:
  - name: bailA
    title: BailA
    enabled: false
  - name: germanA
    title: GermanA
    enabled: false
  - name: pokec
    title: Pokec
    enabled: true
  - name: syn
    title: Syn
    enabled: false

methods:
  - name: EMBER
    enabled: true
  - name: GCN
    enabled: true
  - name: NIFTY
    enabled: true
  - name: FairVGNN
    enabled: true
  - name: FairSIN
    enabled: true
  - name: SFG
    enabled: true
  - name: FatraGNN
    enabled: true
  - name: DANCE
    enabled: true
  - name: SOGA
    enabled: true
  - name: GraphCTA
    enabled: true
  - name: SHOT
    enabled: true
  - name: NRC
    enabled: true
  - name: GALA
    enabled: true

labels:
  groups:
    0: "Y=1, S=0"
    1: "Y=1, S=1"
    2: "Y=0, S=0"
    3: "Y=0, S=1"

sampling:
  max_points: 3000
  stratify: true
  random_state: 22

tsne:
  random_state: 0
  perplexity: 30
  init: pca
  learning_rate: auto
  max_iter: 1000
  metric: euclidean
  normalize: minmax

plot:
  formats: [png, pdf]
  dpi: 300
  # Match the Matplotlib canvas and cropped proportions used by CELL/pilot.
  figure_width: 6.4
  figure_height: 4.35
  point_size: 20
  marker_line_width: 0.0
  marker_edge_color: "none"
  alpha: 0.80
  axis_margin: 0.05
  tick_label_size: 18
  tick_length: 5.0
  tick_width: 1.0
  tick_pad: 3.5
  axis_label_size: 20
  axis_label_pad: 4.0
  spine_color: "#808080"
  spine_width: 1.0
  axes_facecolor: "#FFFFFF"
  equal_aspect: false
  show_ticks: true
  show_spines: true
  tight_layout: false
  savefig_pad_inches: 0.1
  show_legend: true
  legend_size: 14
  legend_ncol: 4
  legend_marker_size: 8.0
  legend_marker_scale: 1.0
  legend_expand_to_axes: true
  legend_bbox_y: 1.0
  legend_handletextpad: 0.35
  legend_columnspacing: 0.8
  legend_handlelength: 1.0
  adjust_for_legend: false
  font_family: "serif"
  font_serif: ["Times New Roman", "Times", "DejaVu Serif"]
  title_template: ""
  title_size: 20
  title_pad: 0
  xlabel_template: "{method} t-SNE result on {dataset}"
  group_order: [0, 1, 2, 3]
  # Blue-red pairing sampled from the supplied scientific-colour reference.
  colors: ["#2A6F97", "#E58D5B", "#8EC5E8", "#F6C8A8"]
  markers: ["o", "o", "o", "o"]
