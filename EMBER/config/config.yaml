bailA:
  cls_encoder: "vanilla"
  sens_encoder: "MLP"
  hidden_dim: 128
  cls_n_layers: 2
  sens_n_layers: 2  # ignored when sens_encoder is MLP
  train_epochs: 500
  lr: 0.006
  lr2_reg: 0.001
  dropout: 0.5
  lambda_sen: 1.0
  lambda_dec: 1.0
  lambda_fair: 1.0
  meta_lr: 0.01
  lambda_coord: 0.75
  source_mmd_bandwidth: 1.0
  adapt_epochs: 60
  tau_c: 0.72
  proto_temp: 0.4
  adapt_lr: 0.0001
  residual_inner_steps: 3
  lambda_residual_l2: 0.03
  group_pseudocount: 500
  lambda_pi: 0.0
  prior_confidence_threshold: 0.75
  prior_pseudocount: 2000
  prior_discount: 0.98

germanA:
  # === Source + Target: transferred encoder/representation ===
  cls_encoder: "GCN"
  sens_encoder: "MLP"
  hidden_dim: 128
  cls_n_layers: 2
  sens_n_layers: 2  # ignored when sens_encoder is MLP

  # === Source stage: base training and regularization ===
  train_epochs: 500
  lr: 0.005
  lr2_reg: 0.001
  dropout: 0.4

  # === Source stage: disentanglement + Meta-Coordinated Fair Alignment ===
  lambda_sen: 4.0
  lambda_dec: 2.0
  lambda_fair: 4.0
  meta_lr: 0.012
  lambda_coord: 1.0
  source_mmd_bandwidth: 1.0

  # === Target stage: shared loop controls / Others ===
  adapt_epochs: 40
  tau_c: 0.65
  proto_temp: 0.35

  # === Target: Minority-Aware Prototype Evolution for Target Adaptation ===
  adapt_lr: 0.003
  residual_inner_steps: 20
  lambda_residual_l2: 0.001
  group_pseudocount: 1.0

  # === Target: Bayesian Test-Time Adaptation ===
  lambda_pi: 1.0
  prior_confidence_threshold: 0.6
  prior_pseudocount: 5.0
  prior_discount: 0.9

pokec:
  # === Source + Target: independent transferred encoders/representations ===
  cls_encoder: "GCN"
  sens_encoder: "MLP"
  hidden_dim: 128
  cls_n_layers: 3
  sens_n_layers: 1  # ignored when sens_encoder is MLP

  # === Source stage: base training and regularization ===
  train_epochs: 500
  lr: 0.004
  lr2_reg: 0.001
  dropout: 0.4

  # === Source stage: disentanglement + Meta-Coordinated Fair Alignment ===
  lambda_sen: 0.5
  lambda_dec: 0.5
  lambda_fair: 2.0
  meta_lr: 0.1
  lambda_coord: 1.0
  source_mmd_bandwidth: 2.0

  # === Target stage: shared loop controls / Others ===
  adapt_epochs: 50
  tau_c: 0.75
  proto_temp: 0.5

  # === Target: Minority-Aware Prototype Evolution for Target Adaptation ===
  adapt_lr: 0.002
  residual_inner_steps: 50
  lambda_residual_l2: 0.001
  group_pseudocount: 500

  # === Target: Bayesian Test-Time Adaptation ===
  lambda_pi: 0.8
  prior_confidence_threshold: 0.75
  prior_pseudocount: 3000
  prior_discount: 0.8

syn:
  # === Source + Target: independent transferred encoders/representations ===
  cls_encoder: "MLP"
  sens_encoder: "MLP"
  hidden_dim: 128
  cls_n_layers: 3
  sens_n_layers: 2  # ignored when sens_encoder is MLP

  # === Source stage: base training and regularization ===
  train_epochs: 600
  lr: 0.003
  lr2_reg: 0.001
  dropout: 0.2

  # === Source stage: disentanglement + Meta-Coordinated Fair Alignment ===
  lambda_sen: 2.0
  lambda_dec: 2.0
  lambda_fair: 10.0
  meta_lr: 0.01
  lambda_coord: 0.3
  source_mmd_bandwidth: 1.0

  # === Target stage: shared loop controls / Others ===
  adapt_epochs: 50
  tau_c: 0.7
  proto_temp: 0.5

  # === Target: Minority-Aware Prototype Evolution for Target Adaptation ===
  adapt_lr: 0.0005
  residual_inner_steps: 5
  lambda_residual_l2: 0.005
  group_pseudocount: 100

  # === Target: Bayesian Test-Time Adaptation ===
  lambda_pi: 0.3
  prior_confidence_threshold: 0.65
  prior_pseudocount: 100
  prior_discount: 0.955


