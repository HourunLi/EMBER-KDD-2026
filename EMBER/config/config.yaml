bailA:
  # === Source + Target: transferred encoder/representation ===
  # Target adaptation freezes this source encoder, but directly uses its
  # representations, classifier predictions, prototypes, and anchors.
  inter_encoder: "GCN"
  hidden_dim: 128
  n_layers: 2

  # === Source stage: base training and regularization ===
  lr: 0.004
  lr2_reg: 0.0001
  train_epochs: 800
  dropout: 0.5

  # === Source stage: disentanglement + Meta-Coordinated Fair Alignment ===
  lambda_sen: 0.5                  # lambda_sen, Eq. (19)
  lambda_dec: 1.0                  # lambda_dec, Eq. (19)
  lambda_fair: 16.0                # beta, Eq. (9)
  meta_lr: 0.02                    # alpha, Eqs. (7) and (9)
  lambda_coord: 0.75               # gamma, Eq. (9)
  source_mmd_bandwidth: 1.4142136  # RBF-MMD bandwidth; no paper symbol

  # === Target stage: shared loop controls / Others ===
  adapt_epochs: 75                 # T, Algorithm 1 / Eq. (21)
  tau_c: 0.65                      # delta, Eqs. (12) and (20)
  proto_temp: 0.6                  # tau, Eqs. (13) and (18)

  # === Target: Minority-Aware Prototype Evolution for Target Adaptation ===
  adapt_lr: 0.00088388348          # optimizer step for Eq. (15); no paper symbol
  residual_inner_steps: 20         # solver steps for Eq. (15); no paper symbol
  lambda_residual_l2: 0.1          # lambda, Eq. (15)
  group_pseudocount: 19.1525       # nu_0, Eq. (14)

  # === Target: Bayesian Test-Time Adaptation ===
  lambda_pi: 0.7                   # eta, Eq. (18)
  prior_confidence_threshold: 0.65 # delta_p, Eq. (17)
  prior_pseudocount: 383.04998     # n_0, Eq. (17)
  prior_discount: 0.8              # omega, Eq. (17)

