syn:
  # === Source + Target: transferred encoder/representation ===
  inter_encoder: "MLP"
  hidden_dim: 256
  # n_layers is intentionally omitted: the MLP encoder does not read it.

  # === Source stage: base training and regularization ===
  lr: 0.005
  lr2_reg: 0.001
  dropout: 0.1

  # === Source stage: disentanglement + Meta-Coordinated Fair Alignment ===
  lambda_sen: 1.0
  lambda_dec: 8.0
  lambda_fair: 8.0
  meta_lr: 0.006
  lambda_coord: 1.0
  source_mmd_bandwidth: 1.0

  # === Target stage: shared loop controls / Others ===
  adapt_epochs: 100
  tau_c: 0.6
  proto_temp: 0.6

  # === Target: Minority-Aware Prototype Evolution for Target Adaptation ===
  adapt_lr: 0.0010416667
  residual_inner_steps: 15
  lambda_residual_l2: 0.1
  group_pseudocount: 125.0

  # === Target: Bayesian Test-Time Adaptation ===
  lambda_pi: 0.7
  prior_confidence_threshold: 0.65
  prior_pseudocount: 250.0
  prior_discount: 0.8
