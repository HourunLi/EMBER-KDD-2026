# Only dataset-sensitive, result-critical hyperparameters belong here.
# Shared method constants, runtime controls, and memory/chunking options use
# the documented defaults in config.py.

bailA:
  # Backbone and source optimization
  inter_encoder: GCN
  hidden_dim: 64
  n_layers: 1
  lr: 0.006
  dropout: 0.6
  # Meta-coordinated source alignment (Eqs. 6-9)
  lambda_fair: 8.0
  meta_lr: 0.03
  source_mmd_bandwidth: 0.5
  # Prototype evolution and Bayesian correction (Eqs. 12-18)
  adapt_epochs: 100
  adapt_lr: 0.0008
  residual_inner_steps: 60
  tau_c: 0.75
  proto_temp: 0.75
  lambda_pi: 0.01
  lambda_residual_l2: 0.0001
  prior_confidence_threshold: 0.75
  prior_pseudocount: 1.0

germanA:
  inter_encoder: GCN
  hidden_dim: 128
  n_layers: 3
  lr: 0.005
  dropout: 0.4
  lambda_fair: 4.0
  meta_lr: 0.02
  source_mmd_bandwidth: 0.75
  adapt_epochs: 25
  adapt_lr: 0.0005
  residual_inner_steps: 20
  tau_c: 0.75
  proto_temp: 0.5
  lambda_pi: 0.2
  lambda_residual_l2: 0.001
  prior_confidence_threshold: 0.75
  prior_pseudocount: 1.0

pokec:
  inter_encoder: GCN
  hidden_dim: 64
  n_layers: 4
  lr: 0.002
  dropout: 0.4
  lambda_fair: 2.0
  meta_lr: 0.01
  source_mmd_bandwidth: 2.0
  adapt_epochs: 50
  adapt_lr: 0.001
  residual_inner_steps: 20
  tau_c: 0.35
  proto_temp: 1.0
  lambda_pi: 0.1
  lambda_residual_l2: 0.001
  prior_confidence_threshold: 0.35
  prior_pseudocount: 10.0

syn:
  inter_encoder: MLP
  hidden_dim: 128
  lr: 0.005
  dropout: 0.4
  lambda_fair: 8.0
  meta_lr: 0.003
  source_mmd_bandwidth: 0.25
  adapt_epochs: 150
  adapt_lr: 0.0005
  residual_inner_steps: 40
  tau_c: 0.5
  proto_temp: 0.1
  lambda_pi: 0.5
  lambda_residual_l2: 0.00001
  prior_confidence_threshold: 0.5
  prior_pseudocount: 25.0
